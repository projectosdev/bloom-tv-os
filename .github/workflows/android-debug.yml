name: Build Bloom debug APK

on:
  push:
    branches:
      - feature/settings-updates-animations
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug -PbloomVersionCode=${{ github.run_number }} -PbloomVersionName=0.1.${{ github.run_number }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bloom-tv-os-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7


      - name: Publish Bloom release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/settings-updates-animations'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Bloom 0.1.${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          target_commitish: feature/settings-updates-animations
          files: app/build/outputs/apk/debug/*.apk
