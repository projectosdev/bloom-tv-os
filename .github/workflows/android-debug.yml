name: Build Bloom debug APK

on:
  push:
    branches:
      - feature/settings-updates-animations
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-debug.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload-debug.outputs.artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug -PbloomVersionCode=${{ github.run_number }} -PbloomVersionName=0.1.${{ github.run_number }}

      - name: Upload debug APK
        id: upload-debug
        uses: actions/upload-artifact@v4
        with:
          name: bloom-tv-os-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish Bloom debug release
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/settings-updates-animations'
    needs: build-debug
    # Newer pushes supersede queued/running preview publishing so an older APK
    # cannot become the latest release after a newer preview has already shipped.
    concurrency:
      group: bloom-tv-preview-release
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-debug.outputs.artifact-id }}
          path: dist
          merge-multiple: true

      - name: Publish Bloom release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Bloom 0.1.${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          target_commitish: feature/settings-updates-animations
          files: dist/*.apk
