name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Bloom APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set preview version
        run: |
          echo "BLOOM_VERSION_CODE=$((GITHUB_RUN_NUMBER + 2))" >> "$GITHUB_ENV"
          echo "BLOOM_VERSION_NAME=0.2.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug -PbloomVersionCode=$BLOOM_VERSION_CODE -PbloomVersionName=$BLOOM_VERSION_NAME

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bloom-tv-os-lite-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Bloom Owner Command Centre APK
        uses: actions/upload-artifact@v4
        with:
          name: bloom-owner-command-centre-debug
          path: owner/build/outputs/apk/debug/owner-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Bloom Test OS APK
        uses: actions/upload-artifact@v4
        with:
          name: bloom-test-os-debug
          path: testos/build/outputs/apk/debug/testos-debug.apk
          if-no-files-found: error
          retention-days: 14
